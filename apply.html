<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply Here | Georgetown Electrical Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
   <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="Georgetown Electrical Systems">
        <img src="assets/logo.png" alt="Georgetown Electrical Systems Logo" class="logo-img">
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="products.html" class="nav-link">Products</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="contactus.html" class="nav-link">Contact Us</a></li>
          <li><a href="apply.html" class="nav-link active">Apply Here</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Container with Glassmorphic Overlay -->
  <main class="hero-container">
    <div class="hero-overlay">
      
      <!-- Left Side Headline -->
      <div class="hero-content">
        <h1>Join the Team Powering the Philippine Electricity Market</h1>
      </div>

      <!-- Right Side Glassmorphism Form Card -->
      <div class="form-card">
        <form id="applyForm" action="#" method="POST" enctype="multipart/form-data" novalidate>
          
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              placeholder="Enter your full name here" 
              required 
            />
            <span class="field-error" id="fullNameError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="name@company.com" 
              required 
            />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number (preferably w/ Viber) *</label>
            <input 
              type="tel" 
              id="mobile" 
              name="mobile" 
              placeholder="+63 900 000 0000" 
              required 
            />
            <span class="field-error" id="mobileError"></span>
          </div>

          <div class="form-group">
            <label for="position">Position Applied For *</label>
            <select id="position" name="position" required>
              <option value="" disabled selected>Select position</option>
              <option value="electrical-engineer">Electrical Engineer</option>
              <option value="field-technician">Field Technician</option>
              <option value="project-manager">Project Manager</option>
              <option value="administrative-staff">Administrative Staff</option>
            </select>
            <span class="field-error" id="positionError"></span>
          </div>

          <div class="form-group">
            <label for="resume">Upload Resume / CV (PDF only) *</label>
            <input 
              type="file" 
              id="resume" 
              name="resume" 
              accept=".pdf,application/pdf" 
              required 
            />
            <span class="field-error" id="resumeError"></span>
          </div>

            <div class="form-group">
              <label for="citizenship">Proof of Citizenship (PDF only) *</label>
              <input type="file" id="citizenship" name="citizenship" accept=".pdf,application/pdf" required />
              <span class="field-error" id="citizenshipError"></span>
            </div>

          <div class="form-group">
            <label for="message">Message / Cover Note</label>
            <textarea 
              id="message" 
              name="message" 
              rows="3" 
              placeholder="Enter your message here..."
            ></textarea>
            <span class="field-error" id="messageError"></span>
          </div>
          
          <button type="submit" class="submit-btn apply-submit">
            <span class="btn-text">Submit</span>
            <span class="btn-arrow" aria-hidden="true">&rarr;</span>
          </button>

        </form>
      </div>

    </div>
  </main>

  <script src="js/apply.js"></script>
</body>
</html>
