<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply Here | Georgetown Electrical Systems</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo-container">
      <a href="index.html">
        <img src="assets/logo.png" alt="GES Georgetown Electrical Systems Logo" class="logo" />
      </a>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="products.html" class="nav-item">Products</a>
      <a href="services.html" class="nav-item">Services</a>
      <a href="contact.html" class="nav-item">Contact Us</a>
      <a href="apply.html" class="nav-item active">Apply Here</a>
    </nav>
  </header>

  <!-- Hero Container with Glassmorphic Overlay -->
  <main class="hero-container">
    <div class="hero-overlay">
      
      <!-- Left Side Headline -->
      <div class="hero-content">
        <h1>Join the Team Powering the Philippine Electricity Market</h1>
      </div>

      <!-- Right Side Glassmorphism Form Card -->
      <div class="form-card">
        <form id="applyForm" action="#" method="POST" enctype="multipart/form-data">
          
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              placeholder="Enter your full name here" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="Enter your email address here" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number (preferably w/ Viber) *</label>
            <input 
              type="tel" 
              id="mobile" 
              name="mobile" 
              placeholder="Enter your mobile number here" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="position">Position Applied For *</label>
            <select id="position" name="position" required>
              <option value="" disabled selected>Select position</option>
              <option value="electrical-engineer">Electrical Engineer</option>
              <option value="field-technician">Field Technician</option>
              <option value="project-manager">Project Manager</option>
              <option value="administrative-staff">Administrative Staff</option>
            </select>
          </div>

          <div class="form-group">
            <label for="resume">Upload Resume / CV (PDF or DOCX) *</label>
            <input 
              type="file" 
              id="resume" 
              name="resume" 
              accept=".pdf,.doc,.docx" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="message">Message / Cover Note</label>
            <textarea 
              id="message" 
              name="message" 
              rows="3" 
              placeholder="Enter your message here..."
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">
            Submit &rarr;
          </button>

        </form>
      </div>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
