<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page | Georgetown Electrical Systems</title>
  <meta name="description" content="Only used for admin login" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/services.css" />
</head>
<body>
    <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="Georgetown Electrical Systems">
        <img src="assets/logo.png" alt="Georgetown Electrical Systems Logo" class="logo-img">
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link active">Home</a></li>
          <li><a href="products.html" class="nav-link">Products</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="contactus.html" class="nav-link">Contact Us</a></li>
          <li><a href="apply.html" class="nav-link">Apply Here</a></li>
          <li><a href="login.html" class="nav-link">Admin Login</a></li>
        </ul>
      </nav>
    </div>
  </header>
    <main class="hero-container">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1 id="welcome-msg">Welcome Admin!</h1>
            </div>

            <div class="form-card">
                <form id="loginForm" action="#" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="fullName">Username *</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="userName" 
                            placeholder="Enter your username here" 
                            required 
                        />
                    </div>

                    <div class="form-group">
                      <label for="email">Password *</label>
                      <input 
                          type="password" 
                          id="password" 
                          name="password" 
                          placeholder="Enter password here" 
                          required 
                      />
                    </div>

                    <button type="Submit" class="submit-btn">
                      Login &rarr;
                    </button>
                </form>
            </div>
        </div>
    </main>
    <footer class="svc-footer">
      <p>&copy; <span id="year">2026</span> Georgetown Electrical Systems. All rights reserved.</p>
    </footer>
    <script src="js/admin.js"></script>
</body>
